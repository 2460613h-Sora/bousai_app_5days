{% extends "base.html" %}

{% block content %}
<div class="home-content">
    <section class="dashboard-card map-card" aria-labelledby="map-title">
        <h2 class="section-heading" id="map-title">
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
            避難所マップ
        </h2>
        <div id="shelterMap" class="shelter-map" aria-label="避難所マップ"></div>
        <p class="map-fallback" id="mapFallback" hidden>地図を読み込めませんでした。避難所検索から一覧を確認できます。</p>
    </section>

    <section class="dashboard-card weather-card" aria-labelledby="weather-title">
        <div class="weather-heading-row">
            <h2 class="section-heading" id="weather-title">
                <i class="fa-solid fa-cloud-sun" aria-hidden="true"></i>
                青森市 気象警報・注意報
            </h2>
            <span class="auto-refresh"><i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i> 10分おき自動更新</span>
        </div>
        <div class="weather-panel" id="weatherContent" aria-live="polite">
            <p class="loading-message">気象情報を読み込み中...</p>
        </div>
    </section>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
{% endblock %}
