{% extends "base.html" %}

{% block content %}
<h2>避難所登録</h2>
<p>新しい避難所情報を登録します。</p>

<!-- 登録結果メッセージ表示 -->
{% if registration_success %}
  <p>避難所を登録しました。</p>
{% endif %}
{% if result_message %}
  <p style="margin-bottom: 1em;">{{ result_message }}</p>
{% endif %}

<form method="POST">
  <p>
    <label for="name">避難所名（必須）</label><br>
    <input type="text" id="name" name="name">
  </p>
  <p><button type="submit">登録</button></p>
</form>
{% endblock %}
